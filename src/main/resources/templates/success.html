<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Успешная регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #282c34;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .success-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 0 auto;
            max-width: 400px;
        }

        h1 {
            color: #61dafb;
        }

        p {
            font-size: 18px;
        }

        /* Анимация огоньков */
        .spark {
            position: absolute;
            top: 0;
            font-size: 1em;
            color: #f39c12;
            animation: glow linear infinite;
        }

        @keyframes glow {
            0% {
                transform: translateY(-100px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
<h1>Регистрация успешна!</h1>
<div class="success-container">
    <p>Спасибо за регистрацию, <span th:text="${name}">Имя</span>!</p>
    <p>Мы рады, что вы с нами!</p>
</div>

<!-- Огоньки -->
<script>
    const sparkCount = 50;
    for (let i = 0; i < sparkCount; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        spark.style.left = Math.random() * 100 + 'vw';
        spark.style.animationDuration = Math.random() * 3 + 2 + 's';
        spark.style.fontSize = Math.random() * 1.5 + 0.5 + 'em';
        spark.innerText = '✨';
        document.body.appendChild(spark);
    }
</script>
</body>
</html>
