<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 20px;
        }
        .table-container {
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #007bff;
            color: white;
            font-weight: normal;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #e9e9e9;
        }
        td {
            color: #333;
            white-space: nowrap;
        }
        .center {
            text-align: center;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 4px 8px;
            text-decoration: none;
            border-radius: 4px;
            color: white;
            background-color: #28a745;
            font-size: 12px;
        }
        .btn:hover {
            background-color: #218838;
        }
        .btn.delete {
            background-color: #dc3545;
        }
        .btn.delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
<h1>Зарегистрированные пользователи</h1>
<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Дата и время</th>
            <th>Telegram</th>
            <th>Телефон</th>
            <th class="center">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td class="center" th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
<!--            <td th:text="${#dates.format(user.dateTime, 'dd.MM.yyyy HH:mm')}"></td>-->
            <td th:text="${user.telegram}"></td>
            <td th:text="${user.phone}"></td>
            <td class="center">
                <div class="actions">
                    <a href="#" class="btn">Редактировать</a>
                    <a href="#" class="btn delete">Удалить</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
